name: auto-team

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: .env
        required: true
    environment:
      # The public entrypoint is Nginx. Keep the API private to this network.
      AUTO_TEAM_BACKEND_HOST: 0.0.0.0
      AUTO_TEAM_BACKEND_PORT: "8000"
    volumes:
      - auto_team_data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${AUTO_TEAM_PORT:-8080}:80"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  auto_team_data:
    name: ${AUTO_TEAM_DATA_VOLUME:-auto_team_data}
