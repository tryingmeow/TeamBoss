server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # 客户端来源 IP 的认定，直接决定限流和登录失败锁定的有效性。
    #
    # 默认（本容器就是公网入口）：$remote_addr 是 TCP 连接的真实对端，访客自己带的
    # X-Real-IP / X-Forwarded-For 一律不采信。绝不能改成透传访客提供的头——那样任何人
    # 每次请求换一个假 IP 就能让限流和 15 分钟登录锁定永远不触发，管理员密码可无限爆破。
    #
    # 如果本容器藏在另一层反代后面（宿主机 nginx、Cloudflare、云负载均衡），取消下面两行
    # 注释，并把 CIDR 换成那层反代的实际来源地址。real_ip 模块会按 **TCP 连接来源** 判断
    # 要不要采信 X-Real-IP，采信后 $remote_addr 自动变成真实访客 IP，下面的 proxy_set_header
    # 不用动。按连接来源判断，而不是按 header 在不在，是这里唯一安全的做法。
    #
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Real-IP;

    # 安全响应头（HSTS 交由上游 TLS 层设置）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # The SPA uses same-origin /api calls. The backend never needs a host port.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Client-side routes must resolve to the React entrypoint on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
