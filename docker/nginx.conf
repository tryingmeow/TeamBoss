server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # 客户端来源 IP 的认定，直接决定限流和登录失败锁定的有效性。
    #
    # 本容器直接面对访客时（AUTO_TEAM_BIND 不是回环）：$remote_addr 是 TCP 连接的真实对端，
    # 访客自己带的 X-Real-IP / X-Forwarded-For 一律不采信。绝不能改成透传访客提供的头——那样任何人
    # 每次请求换一个假 IP 就能让限流和 15 分钟登录锁定永远不触发，管理员密码可无限爆破。
    #
    # 本容器藏在宿主机反代后面时，访客连接经 Docker 转发后来源都是网桥网关；不采信上一层
    # 反代的 X-Real-IP，所有访客就会被当成同一个人，任意匿名访客都能把自助页和管理员登录
    # 一起限流。real_ip 模块按 **TCP 连接来源** 判断要不要采信 X-Real-IP，采信后
    # $remote_addr 自动变成真实访客 IP，下面的 proxy_set_header 不用动。按连接来源判断，
    # 而不是按 header 在不在，是这里唯一安全的做法。
    #
    # 下面这个文件由 docker/real-ip.sh 在容器启动时生成：Web 端口只绑回环（默认）时信任
    # 私有网段，否则谁都不信；用 AUTO_TEAM_REAL_IP_FROM 可以显式指定。宿主机反代必须用
    # 自己看到的连接来源 **覆盖** X-Real-IP，不能透传访客自带的值。
    include /etc/nginx/real_ip.conf;

    # 安全响应头（HSTS 交由上游 TLS 层设置）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # 管理 Key 存在浏览器 localStorage 里，前端一旦出现 XSS 就等于后台被接管。CSP 只放行本站
    # 脚本和本站 API，注入的脚本既跑不起来，也没法把 Key 发到别处。主题初始化脚本因此放在
    # public/theme-init.js 而不是内联；style-src 的 'unsafe-inline' 是给 Radix 运行时注入的
    # <style> 用的（滚动锁、Select 视口）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # The SPA uses same-origin /api calls. The backend never needs a host port.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Client-side routes must resolve to the React entrypoint on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
